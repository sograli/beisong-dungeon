<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101413">
  <title>安装背诵地牢</title>
  <style>
    :root{color-scheme:dark;--bg:#101413;--panel:#1a211f;--line:#34413d;--gold:#e5bd58;--muted:#aab2ad;--ink:#edf1ed}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 0,#26332e 0,#101413 52%);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}
    main{width:min(620px,100%);margin:auto;padding:clamp(28px,8vw,72px) 20px 40px;text-align:center}.mark{font-size:62px;color:var(--gold);filter:drop-shadow(0 0 18px #b89135);margin-bottom:8px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold)}h1{font-family:serif;font-size:clamp(30px,8vw,48px);margin:8px 0}.sub{color:var(--muted);line-height:1.7;margin:0 auto 25px}.open{display:inline-block;text-decoration:none;color:#fff2c2;background:#463b21;border:1px solid var(--gold);padding:13px 25px;margin-bottom:24px}.steps{display:grid;gap:12px;text-align:left}.step{background:rgba(26,33,31,.92);border:1px solid var(--line);padding:16px}.step b{display:block;color:var(--gold);margin-bottom:7px}.step p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}.note{font-size:12px;color:#89938e;margin-top:20px;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <div class="mark">◆</div>
    <div class="eyebrow">背诵地牢</div>
    <h1>安装应用</h1>
    <p class="sub">这是跨平台安装入口。安卓和苹果都可以从 HTTPS 网页安装到主屏幕，进度由账号云端同步。</p>
    <a class="open" href="./index.html">打开背诵地牢</a>
    <section class="steps">
      <article class="step"><b>安卓手机</b><p>用 Chrome 打开本页，点击“打开背诵地牢”，再点击浏览器菜单中的“安装应用”或“添加到主屏幕”。</p></article>
      <article class="step"><b>苹果手机</b><p>用 Safari 打开本页，点击“打开背诵地牢”，再点底部分享按钮，选择“添加到主屏幕”。</p></article>
      <article class="step"><b>电脑</b><p>用 Chrome 或 Edge 打开“打开背诵地牢”，地址栏右侧出现安装图标时点击即可。</p></article>
    </section>
    <p class="note">必须使用 HTTPS 网站地址。直接打开电脑上的 file:/// 本地文件时，浏览器不会显示安装选项。</p>
  </main>
</body>
</html>
