  <title>背诵地牢</title>
  <style>
    :root{--ink:#e9ece8;--muted:#aab2ad;--dark:#101413;--panel:#1a211f;--line:#34413d;--gold:#e5bd58;--red:#dc5e4e;--green:#65c18c;--blue:#68a9c7;--stone:#59635e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--dark);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}body{min-height:100svh;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:32px 32px}button,input,textarea{font:inherit}button{color:inherit}.app{min-height:100svh;display:flex;flex-direction:column}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,52px);border-bottom:1px solid #2b3431;background:rgba(16,20,19,.92);position:relative;z-index:10}.brand{font-family:serif;font-size:22px;font-weight:800;color:#f4e7ba}.stats{display:flex;gap:18px;align-items:center}.stat{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}.meter{width:88px;height:8px;background:#303735;overflow:hidden}.meter>i{display:block;height:100%;background:var(--red);transition:.3s}.energy i{background:var(--gold)}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#171d1b;display:grid;place-items:center;cursor:pointer}.view{display:none;flex:1;min-height:0}.view.active{display:flex}.home{flex-direction:column;align-items:center;justify-content:space-between;padding:28px 18px 0;overflow:hidden}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:2px}.home h1{font-family:serif;font-size:clamp(26px,4vw,44px);margin:7px 0 4px;letter-spacing:0}.sub{color:var(--muted);font-size:14px}.dungeon{position:relative;width:min(980px,96vw);height:min(62vw,560px);min-height:390px;margin-top:18px;border-radius:520px 520px 0 0;background:radial-gradient(circle at 50% 88%,#333d39 0 14%,#1b2320 15% 42%,#0c100f 71%);border:5px solid #4a5651;border-bottom:0;box-shadow:inset 0 0 90px #000,0 -16px 60px rgba(0,0,0,.5)}.floor{position:absolute;left:-10%;right:-10%;bottom:-2px;height:29%;background:repeating-linear-gradient(170deg,#2b322f 0 2px,#171c1a 3px 42px);clip-path:polygon(10% 20%,90% 20%,100% 100%,0 100%)}.door{position:absolute;width:clamp(72px,10vw,106px);height:clamp(110px,15vw,155px);border:3px solid #69736d;border-bottom:0;border-radius:50px 50px 0 0;background:linear-gradient(90deg,#171a19,#303632 48%,#121514);box-shadow:inset 0 0 20px #000,0 0 18px rgba(0,0,0,.6);cursor:pointer;transform-origin:bottom;transition:.2s}.door:hover,.door:focus-visible{filter:brightness(1.3);transform:scale(1.04)}.door span{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);width:120%;font-size:12px;text-align:center;color:#f2db99;text-shadow:0 2px 4px #000}.door b{position:absolute;right:16%;top:55%;width:6px;height:6px;border-radius:50%;background:#d9bd6b}.d1{left:7%;bottom:20%;transform:rotate(-8deg)}.d2{left:20%;bottom:31%;transform:rotate(-5deg)}.d3{left:34%;bottom:38%;transform:rotate(-2deg)}.d4{left:50%;bottom:40%;transform:translateX(-50%)}.d5{right:34%;bottom:38%;transform:rotate(2deg)}.d6{right:20%;bottom:31%;transform:rotate(5deg)}.d7{right:7%;bottom:20%;transform:rotate(8deg)}.path-view{padding:28px clamp(18px,5vw,72px);flex-direction:column}.crumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.back{border:0;background:none;color:var(--gold);cursor:pointer;padding:8px 0}.path-head{margin:28px 0}.path-head h2{font-family:serif;font-size:clamp(28px,4vw,42px);margin:0 0 8px}.path-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.path-card{min-height:136px;border:1px solid var(--line);background:#171d1b;padding:20px;text-align:left;cursor:pointer;position:relative;overflow:hidden}.path-card:not(:disabled):hover{border-color:var(--gold)}.path-card:disabled{opacity:.55;cursor:not-allowed}.path-card .num{font-family:serif;color:var(--gold);font-size:13px}.path-card h3{font-size:18px;margin:12px 0 6px}.path-card p{font-size:12px;color:var(--muted);margin:0}.battle{flex-direction:column}.battle-head{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(14px,3vw,34px);border-bottom:1px solid var(--line);gap:12px}.rounds{display:flex;gap:5px}.round-dot{width:32px;height:5px;background:#3a423f}.round-dot.on{background:var(--gold)}.arena{flex:1;display:grid;grid-template-columns:minmax(110px,1fr) minmax(280px,2.2fr) minmax(110px,1fr);gap:clamp(10px,3vw,40px);align-items:center;padding:22px clamp(12px,3vw,38px);background:radial-gradient(circle at 50% 55%,#342821,#171b19 45%,#0d1110)}.fighter{text-align:center}.sprite{width:clamp(84px,12vw,138px);aspect-ratio:1;margin:auto;display:grid;place-items:center;font-size:clamp(50px,8vw,90px);filter:drop-shadow(0 9px 10px #000);animation:float 2.2s ease-in-out infinite}.monster .sprite{animation-duration:1.4s}@keyframes float{50%{transform:translateY(-8px)}}.name{font-size:12px;color:var(--muted)}.battle-panel{background:rgba(18,23,21,.94);border:1px solid #4b5651;padding:clamp(16px,3vw,28px);min-height:330px;box-shadow:0 20px 50px #000}.round-label{font-size:11px;color:var(--gold);letter-spacing:2px}.question{font-size:clamp(16px,2vw,21px);line-height:1.9;margin:16px 0}.blank{display:inline-flex;min-width:92px;height:36px;vertical-align:middle;border-bottom:2px solid var(--gold);align-items:center;justify-content:center;color:var(--gold);padding:0 7px}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:22px}.card{border:1px solid #7d704c;background:#ece6d8;color:#1b211f;min-height:43px;padding:9px 13px;cursor:grab;box-shadow:0 4px 0 #756a4d}.card.selected{outline:3px solid var(--blue)}.answer-input{width:100%;min-height:92px;padding:13px;background:#f2efe7;color:#171b19;border:2px solid transparent;resize:vertical}.action-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}.primary{border:1px solid var(--gold);background:#463b21;color:#fff2c2;padding:10px 18px;cursor:pointer}.hint{font-size:12px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(100px);background:#eef0eb;color:#18201d;padding:11px 18px;z-index:50;opacity:0;transition:.25s;box-shadow:0 8px 30px #000}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:none;place-items:center;padding:18px}.modal.open{display:grid}.modal-box{width:min(520px,100%);background:#1b2320;border:1px solid #66736d;padding:25px}.modal h2{font-family:serif;margin-top:0}.review-q{line-height:1.8}.victory{text-align:center}.victory .gem{font-size:76px;filter:drop-shadow(0 0 16px #edc458)}@media(max-width:700px){.topbar{height:58px}.brand{font-size:18px}.stat-label{display:none}.stats{gap:9px}.meter{width:54px}.home{padding-top:18px}.dungeon{width:112vw;height:72vh;min-height:440px}.door{width:62px;height:104px}.door span{font-size:10px}.d1{left:9%;bottom:17%}.d2{left:21%;bottom:29%}.d3{left:34%;bottom:37%}.d5{right:34%;bottom:37%}.d6{right:21%;bottom:29%}.d7{right:9%;bottom:17%}.arena{grid-template-columns:72px 1fr 72px;align-items:start;padding-top:20px}.fighter{padding-top:80px}.battle-panel{padding:15px;min-height:400px}.sprite{font-size:48px}.name{font-size:10px}.battle-head{font-size:12px}.question{font-size:15px}.path-grid{grid-template-columns:1fr}.path-view{padding-top:18px}}@media(max-width:430px){.arena{grid-template-columns:1fr}.fighter{display:none}.battle-panel{min-height:460px}.dungeon{width:128vw}.door{width:58px}.door span{width:105%;font-size:9px}.d1{left:13%}.d7{right:13%}}
    body{overflow-x:hidden;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .install-btn{display:none;border:1px solid var(--gold);background:#3e351f;color:#ffeeb4;height:40px;padding:0 12px;cursor:pointer}.install-btn.ready{display:block}
    @media(max-width:430px){.topbar{padding:0 12px}.stats{gap:6px}.stats .meter{display:none}.icon-btn{width:34px;height:34px}.home{padding-left:12px;padding-right:12px}.home>div:first-child{width:100%}.home h1{font-size:24px;line-height:1.35}.dungeon{width:100vw;height:68vh;min-height:430px}.door{width:48px;height:92px}.door span{width:108%;font-size:8px}.d1{left:1%;bottom:17%}.d2{left:14%;bottom:28%}.d3{left:27%;bottom:36%}.d4{bottom:39%}.d5{right:27%;bottom:36%}.d6{right:14%;bottom:28%}.d7{right:1%;bottom:17%}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand">背诵地牢</div><div class="stats"><button class="install-btn" id="installBtn">安装</button><div class="stat"><span>♥</span><span class="stat-label">生命</span><div class="meter"><i id="hpBar"></i></div><b id="hpText">100</b></div><div class="stat"><span>◆</span><span class="stat-label">魔法石</span><div class="meter energy"><i id="energyBar"></i></div><b id="energyText">0</b></div><button class="icon-btn" id="crystalBtn" title="水晶球复习">◉</button><button class="icon-btn" id="musicBtn" title="开关音乐">♫</button></div></header>
  <section class="view home active" id="homeView"><div><div class="eyebrow">背诵地牢</div><h1>选择一道门，踏入知识的岔路</h1><div class="sub">七册教材 · 三重试炼 · 长期记忆</div></div><div class="dungeon"><div class="floor"></div><button class="door d1" data-book="0"><span>政治必修一</span><b></b></button><button class="door d2" data-book="1"><span>政治必修二</span><b></b></button><button class="door d3" data-book="2"><span>政治必修三</span><b></b></button><button class="door d4" data-book="3"><span>政治必修四</span><b></b></button><button class="door d5" data-book="4"><span>政治选修一</span><b></b></button><button class="door d6" data-book="5"><span>政治选修二</span><b></b></button><button class="door d7" data-book="6"><span>政治选修三</span><b></b></button></div></section>
  <section class="view path-view" id="pathView"><div class="crumb"><button class="back" id="backBtn">← 返回</button><span id="crumbText"></span></div><div class="path-head"><div class="eyebrow" id="pathEyebrow"></div><h2 id="pathTitle"></h2><div class="sub" id="pathSub"></div></div><div class="path-grid" id="pathGrid"></div></section>
  <section class="view battle" id="battleView"><div class="battle-head"><button class="back" id="leaveBattle">← 离开战斗</button><span id="battleTitle"></span><div class="rounds"><i class="round-dot"></i><i class="round-dot"></i><i class="round-dot"></i></div></div><div class="arena"><div class="fighter player"><div class="sprite">🧙</div><div class="name">记忆术士</div></div><div class="battle-panel" id="battlePanel"></div><div class="fighter monster"><div class="sprite" id="monsterSprite">👹</div><div class="name" id="monsterName">概念噬兽</div></div></div></section>
</main>
<div class="modal" id="reviewModal"><div class="modal-box"><button class="back" id="closeReview">× 关闭</button><h2>水晶球回响</h2><p class="sub">最久未复习的知识正在显现</p><div id="reviewBody"></div></div></div><div class="modal" id="victoryModal"><div class="modal-box victory"><div class="gem">◆</div><h2>试炼完成</h2><p>魔法石吸收了 1 点能量</p><button class="primary" id="returnHome">返回地牢</button></div></div><div class="toast" id="toast"></div>
<script>
const books=['政治必修一','政治必修二','政治必修三','政治必修四','政治选修一','政治选修二','政治选修三'];
const units=['第一单元','第二单元','第三单元','第四单元'];
const lessons=[
 {title:'我国的生产资料所有制',questions:[
  {stem:'我国在社会主义初级阶段坚持____为主体、多种所有制经济共同发展。',answer:'公有制',subs:[{q:'生产资料所有制在生产关系中起着什么作用？',a:'决定性作用'},{q:'公有制经济包括国有经济、集体经济以及什么？',a:'混合所有制经济中的国有成分和集体成分'}],full:'我国在社会主义初级阶段坚持公有制为主体、多种所有制经济共同发展。'},
  {stem:'____是社会主义初级阶段经济制度的根本特征，是社会主义经济制度的基础。',answer:'以公有制为主体',subs:[{q:'公有资产在社会总资产中要处于什么地位？',a:'占优势'},{q:'国有经济要控制什么？',a:'国民经济命脉'}],full:'以公有制为主体是社会主义初级阶段经济制度的根本特征，是社会主义经济制度的基础。'},
  {stem:'国有经济起主导作用，主要体现在____上。',answer:'控制力',subs:[{q:'国有企业是什么的主要实现形式？',a:'国有经济'},{q:'国有企业是中国特色社会主义的什么支柱？',a:'重要物质基础和政治基础'}],full:'国有经济起主导作用，主要体现在控制力上。'}]},
 {title:'我国的社会主义市场经济体制',questions:[
  {stem:'市场决定资源配置是____的一般规律。',answer:'市场经济',subs:[{q:'市场配置资源主要通过哪些机制？',a:'价格、供求、竞争'},{q:'市场调节具有什么缺陷？',a:'自发性、盲目性、滞后性'}],full:'市场决定资源配置是市场经济的一般规律。'},
  {stem:'社会主义市场经济体制的根本目标是____。',answer:'促进全体人民实现共同富裕',subs:[{q:'社会主义市场经济体制的重要特征是什么？',a:'坚持党的领导'},{q:'发挥我国社会主义制度优越性的内在要求是什么？',a:'科学的宏观调控、有效的政府治理'}],full:'促进全体人民实现共同富裕是社会主义市场经济体制的根本目标。'},
  {stem:'我国政府的经济职能之一，是通过____保持宏观经济稳定。',answer:'宏观经济政策',subs:[{q:'宏观调控的主要目标有哪些？',a:'促进经济增长、增加就业、稳定物价、保持国际收支平衡'},{q:'宏观调控最常用的经济手段是什么？',a:'财政政策和货币政策'}],full:'我国政府通过宏观经济政策保持宏观经济稳定。'}]}
];
let state=JSON.parse(localStorage.getItem('zhijing-state')||'null')||{hp:100,energy:0,reviews:{}};
let nav={book:1,unit:0,lesson:0,stage:'units'}, battle={round:1,qIndex:0,subIndex:0,order:[],selected:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('zhijing-state',JSON.stringify(state));updateStats()}
function updateStats(){state.hp=Math.max(0,Math.min(100,state.hp));$('#hpText').textContent=state.hp;$('#hpBar').style.width=state.hp+'%';$('#energyText').textContent=state.energy;$('#energyBar').style.width=(state.energy%10)*10+'%'}
function show(id){$$('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function attack(){state.hp-=3;save();toast('怪物反击，生命 -3');if(state.hp<=0){toast('生命耗尽，请前往水晶球复习');setTimeout(openReview,600)}}
$$('.door').forEach(d=>d.onclick=()=>{nav={book:+d.dataset.book,unit:0,lesson:0,stage:'units'};renderPath()});
function renderPath(){show('#pathView');const available=nav.book===1;$('#crumbText').textContent=books[nav.book];$('#pathEyebrow').textContent=nav.stage==='units'?'第一处岔路':'第二处岔路';$('#pathTitle').textContent=nav.stage==='units'?books[nav.book]:'选择一课';$('#pathSub').textContent=available?'沿着教材章节继续深入':'这册教材的题库将在后续更新中开放';const grid=$('#pathGrid');grid.innerHTML='';if(nav.stage==='units'){units.forEach((u,i)=>{const enabled=available&&i===0;grid.insertAdjacentHTML('beforeend',`<button class="path-card" data-i="${i}" ${enabled?'':'disabled'}><span class="num">0${i+1}</span><h3>${u}</h3><p>${enabled?'2 课 · 已开放':'题库待更新'}</p></button>`)});grid.querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{nav.unit=+b.dataset.i;nav.stage='lessons';renderPath()})}else{lessons.forEach((l,i)=>grid.insertAdjacentHTML('beforeend',`<button class="path-card" data-i="${i}"><span class="num">第 ${i+1} 课</span><h3>${l.title}</h3><p>3 个核心问题 · 三重试炼</p></button>`));grid.querySelectorAll('button').forEach(b=>b.onclick=()=>startBattle(+b.dataset.i))}}
$('#backBtn').onclick=()=>{if(nav.stage==='lessons'){nav.stage='units';renderPath()}else show('#homeView')};
function startBattle(i){nav.lesson=i;battle={round:1,qIndex:0,subIndex:0,order:shuffle([0,1,2]),selected:null};show('#battleView');setMusic('battle');renderBattle()}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function q(){return lessons[nav.lesson].questions[battle.order[battle.qIndex]]}
function renderBattle(){const dot=$$('.round-dot');dot.forEach((d,i)=>d.classList.toggle('on',i<battle.round));$('#battleTitle').textContent=`${lessons[nav.lesson].title} · 第 ${battle.round} 回合`;const p=$('#battlePanel');if(battle.round===1){const item=q();const choices=shuffle(lessons[nav.lesson].questions.map(x=>x.answer));p.innerHTML=`<div class="round-label">回合一 · 识别概念 ${battle.qIndex+1}/3</div><div class="question">${item.stem.replace('____','<span class="blank" id="dropZone">拖入卡牌</span>')}</div><div class="cards">${choices.map((x,i)=>`<button draggable="true" class="card" data-answer="${x}">${x}</button>`).join('')}</div><div class="action-row"><span class="hint">拖拽卡牌，或依次点击卡牌与空格</span></div>`;bindCards(item.answer)}else if(battle.round===2){const item=q(),sub=item.subs[battle.subIndex];p.innerHTML=`<div class="round-label">回合二 · 手写碎片 ${battle.qIndex+1}/3 · ${battle.subIndex+1}/${item.subs.length}</div><div class="question">${sub.q}<br><span class="blank" id="dropZone">拖入白卡</span></div><div class="cards"><div draggable="true" class="card" id="whiteCard">白卡：<span id="cardText">尚未书写</span></div></div><textarea class="answer-input" id="answerInput" placeholder="在白卡上写下答案"></textarea><div class="action-row"><span class="hint">写完后拖动白卡，或点击白卡再点空格</span></div>`;$('#answerInput').oninput=e=>$('#cardText').textContent=e.target.value||'尚未书写';bindWhite(sub.a)}else{const item=q();p.innerHTML=`<div class="round-label">回合三 · 完整重构 ${battle.qIndex+1}/3</div><div class="question">核心问题：${item.stem.replace('____','？')}</div><textarea class="answer-input" id="fullInput" placeholder="完整写出整句话"></textarea><div class="action-row"><span class="hint">标点差异不影响判断</span><button class="primary" id="submitFull">释放咒文</button></div>`;$('#submitFull').onclick=()=>checkFull(item.full)} }
function bindCards(correct){$$('.card').forEach(c=>{c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.answer);c.onclick=()=>{$$('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');battle.selected=c.dataset.answer}});const z=$('#dropZone');z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();checkCard(e.dataTransfer.getData('text/plain'),correct)};z.onclick=()=>battle.selected&&checkCard(battle.selected,correct)}
function checkCard(a,correct){if(norm(a)===norm(correct)){toast('命中！怪物被消灭');nextQuestion()}else attack()}
function bindWhite(correct){const c=$('#whiteCard'),z=$('#dropZone');c.ondragstart=e=>e.dataTransfer.setData('text/plain',$('#answerInput').value);c.onclick=()=>{battle.selected=$('#answerInput').value;c.classList.add('selected')};z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();checkWhite(e.dataTransfer.getData('text/plain'),correct)};z.onclick=()=>checkWhite(battle.selected||$('#answerInput').value,correct)}
function checkWhite(a,correct){if(norm(a)===norm(correct)){toast('碎片净化成功');const item=q();if(++battle.subIndex>=item.subs.length){battle.subIndex=0;nextQuestion()}else renderBattle()}else attack()}
function norm(s){return (s||'').replace(/[，。、“”‘’；：,.!！?？\s]/g,'')}
function checkFull(correct){if(norm($('#fullInput').value)===norm(correct)){toast('知识重构完成');nextQuestion()}else attack()}
function nextQuestion(){battle.qIndex++;if(battle.qIndex>=3){if(battle.round===3){state.energy++;save();$('#victoryModal').classList.add('open');setMusic('calm');return}battle.round++;battle.qIndex=0;battle.subIndex=0;battle.order=shuffle([0,1,2])}setTimeout(renderBattle,300)}
$('#leaveBattle').onclick=()=>{show('#homeView');setMusic('calm')};$('#returnHome').onclick=()=>{$('#victoryModal').classList.remove('open');show('#homeView')};
function allReviewItems(){return lessons.flatMap((l,li)=>l.questions.flatMap((x,qi)=>x.subs.map((s,si)=>({id:`${li}-${qi}-${si}`,q:s.q,a:s.a}))))}
function openReview(){const items=allReviewItems().sort((a,b)=>(state.reviews[a.id]||0)-(state.reviews[b.id]||0)),r=items[0];$('#reviewBody').innerHTML=`<div class="review-q">${r.q}<br><span class="blank">填写黄框内容</span></div><textarea class="answer-input" id="reviewInput" placeholder="写下答案"></textarea><div class="action-row"><span class="hint">答对恢复 60 生命</span><button class="primary" id="submitReview">确认</button></div>`;$('#submitReview').onclick=()=>{if(norm($('#reviewInput').value)===norm(r.a)){state.hp=Math.min(100,state.hp+60);state.reviews[r.id]=Date.now();save();toast('记忆恢复，生命 +60');$('#reviewModal').classList.remove('open')}else attack()};$('#reviewModal').classList.add('open')}
$('#crystalBtn').onclick=openReview;$('#closeReview').onclick=()=>$('#reviewModal').classList.remove('open');
let audioCtx=null,musicMode='off',timer=null;function setMusic(mode){musicMode=mode;if(!audioCtx)return;clearInterval(timer);const play=()=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=mode==='battle'?'sawtooth':'sine';o.frequency.value=mode==='battle'?[110,147,165,196][Math.floor(Math.random()*4)]:[196,220,247][Math.floor(Math.random()*3)];g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+(mode==='battle'?.18:.8));o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(mode==='battle'?.2:.85))};timer=setInterval(play,mode==='battle'?230:900);play()}
$('#musicBtn').onclick=()=>{if(audioCtx){audioCtx.close();audioCtx=null;clearInterval(timer);$('#musicBtn').textContent='♫'}else{audioCtx=new(window.AudioContext||window.webkitAudioContext)();$('#musicBtn').textContent='♬';setMusic($('#battleView').classList.contains('active')?'battle':'calm')}};
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').classList.add('ready')});$('#installBtn').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').classList.remove('ready')};window.addEventListener('appinstalled',()=>toast('背诵地牢已安装'));
updateStats();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').then(reg=>{reg.update();if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING')});
</script>
