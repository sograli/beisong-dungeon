$$('.door').forEach(d=>d.onclick=()=>toast('使用摇杆控制角色走到门前'));

function renderPath(){show('#pathView');const available=nav.book===1;$('#crumbText').textContent=books[nav.book];$('#pathEyebrow').textContent=nav.stage==='units'?'第一处岔路':'第二处岔路';$('#pathTitle').textContent=nav.stage==='units'?books[nav.book]:'选择一课';$('#pathSub').textContent=available?'沿着教材章节继续深入':'这册教材的题库将在后续更新中开放';const grid=$('#pathGrid');grid.innerHTML='';if(nav.stage==='units'){units.forEach((u,i)=>{const enabled=available&&i===0;grid.insertAdjacentHTML('beforeend',`<button class="path-card" data-i="${i}" ${enabled?'':'disabled'}><span class="num">0${i+1}</span><h3>${u}</h3><p>${enabled?'2 课 · 已开放':'题库待更新'}</p></button>`)});grid.querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{nav.unit=+b.dataset.i;nav.stage='lessons';renderPath()})}else{lessons.forEach((l,i)=>grid.insertAdjacentHTML('beforeend',`<button class="path-card" data-i="${i}"><span class="num">第 ${i+1} 课</span><h3>${l.title}</h3><p>3 个核心问题 · 三重试炼</p></button>`));grid.querySelectorAll('button').forEach(b=>b.onclick=()=>startBattle(+b.dataset.i))}}
$('#backBtn').onclick=()=>{if(nav.stage==='lessons'){nav.stage='units';renderPath()}else show('#homeView')};
function startBattle(i){nav.lesson=i;$('#prepTitle').textContent=lessons[i].title+' · 战斗准备';const unlocked=state.level>=2,lens=state.level>=4;$('#codexLock').textContent=(unlocked?'魔典已展开，可在开战前查看答案':'魔典将在 2 级解锁')+(lens?' · 透镜已装备（本场 2 次）':' · 透镜将在 4 级解锁');$('#codexBody').innerHTML=unlocked?lessons[i].questions.map((x,n)=>`<div class="codex-entry">${n+1}. ${x.stem.replace('____','【'+x.answer+'】')}<b>${x.full}</b></div>`).join(''):'';$('#prepModal').classList.add('open')}
function beginBattle(){battle={round:1,qIndex:0,subIndex:0,order:shuffle([0,1,2]),selected:null,lensUses:state.level>=4?2:0,revealed:{}};$('#prepModal').classList.remove('open');show('#battleView');setMusic('battle');renderBattle()}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function q(){return lessons[nav.lesson].questions[battle.order[battle.qIndex]]}
function renderBattle(){const dot=$$('.round-dot');dot.forEach((d,i)=>d.classList.toggle('on',i<battle.round));$('#battleTitle').textContent=`${lessons[nav.lesson].title} · 第 ${battle.round} 回合`;const p=$('#battlePanel');if(battle.round===1){const item=q();const choices=shuffle(lessons[nav.lesson].questions.map(x=>x.answer));p.innerHTML=`<div class="round-label">回合一 · 识别概念 ${battle.qIndex+1}/3</div><div class="question">${item.stem.replace('____','<span class="blank" id="dropZone">拖入卡牌</span>')}</div><div class="cards">${choices.map((x,i)=>`<button draggable="true" class="card" data-answer="${x}">${x}</button>`).join('')}</div><div class="action-row"><span class="hint">拖拽卡牌，或依次点击卡牌与空格</span></div>`;bindCards(item.answer)}else if(battle.round===2){const item=q(),sub=item.subs[battle.subIndex];p.innerHTML=`<div class="round-label">回合二 · 手写碎片 ${battle.qIndex+1}/3 · ${battle.subIndex+1}/${item.subs.length}</div><div class="question">${sub.q}<br><span class="blank" id="dropZone">拖入白卡</span></div><div class="cards"><div draggable="true" class="card" id="whiteCard">白卡：<span id="cardText">尚未书写</span></div></div><textarea class="answer-input" id="answerInput" placeholder="在白卡上写下答案"></textarea><div class="action-row"><span class="hint">写完后拖动白卡，或点击白卡再点空格</span></div>`;$('#answerInput').oninput=e=>$('#cardText').textContent=e.target.value||'尚未书写';bindWhite(sub.a)}else{const item=q();p.innerHTML=`<div class="round-label">回合三 · 完整重构 ${battle.qIndex+1}/3</div><div class="question">核心问题：${item.stem.replace('____','？')}</div><textarea class="answer-input" id="fullInput" placeholder="完整写出整句话"></textarea><div class="action-row"><span class="hint">标点差异不影响判断</span><button class="primary" id="submitFull">释放咒文</button></div>`;$('#submitFull').onclick=()=>checkFull(item.full)} }
const baseRenderBattle=renderBattle;renderBattle=function(){baseRenderBattle();appendLens()};
function currentLensAnswer(){return battle.round===1?q().answer:battle.round===2?q().subs[battle.subIndex].a:q().full}
function lensKey(){return `${battle.round}-${battle.qIndex}-${battle.subIndex}`}
function appendLens(){if(state.level<4)return;const key=lensKey(),answer=currentLensAnswer(),shown=battle.revealed[key]||[];$('#battlePanel').insertAdjacentHTML('beforeend',`<div class="lens-box"><span class="lens-result" id="lensResult">${maskLens(answer,shown)}</span><button class="lens-btn" id="lensBtn" ${battle.lensUses<1?'disabled':''}>透镜 ${battle.lensUses}/2</button></div>`);$('#lensBtn').onclick=useLens}
function maskLens(answer,shown){return [...answer].map((c,i)=>/[\u4e00-\u9fff]/.test(c)?(shown.includes(i)?c:'□'):c).join('')}
function useLens(){if(battle.lensUses<1)return;const answer=currentLensAnswer(),key=lensKey(),shown=battle.revealed[key]||[],available=[...answer].map((c,i)=>/[\u4e00-\u9fff]/.test(c)&&!shown.includes(i)?i:-1).filter(i=>i>=0);if(!available.length)return toast('当前答案已全部显现');shown.push(available[Math.floor(Math.random()*available.length)]);battle.revealed[key]=shown;battle.lensUses--;$('#lensResult').textContent=maskLens(answer,shown);$('#lensBtn').textContent=`透镜 ${battle.lensUses}/2`;$('#lensBtn').disabled=battle.lensUses<1;toast('透镜揭示了一个字')}
function bindCards(correct){$$('.card').forEach(c=>{c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.answer);c.onclick=()=>{$$('.card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');battle.selected=c.dataset.answer}});const z=$('#dropZone');z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();checkCard(e.dataTransfer.getData('text/plain'),correct)};z.onclick=()=>battle.selected&&checkCard(battle.selected,correct)}
function checkCard(a,correct){if(norm(a)===norm(correct)){toast('命中！怪物被消灭');nextQuestion()}else attack()}
function bindWhite(correct){const c=$('#whiteCard'),z=$('#dropZone');c.ondragstart=e=>e.dataTransfer.setData('text/plain',$('#answerInput').value);c.onclick=()=>{battle.selected=$('#answerInput').value;c.classList.add('selected')};z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();checkWhite(e.dataTransfer.getData('text/plain'),correct)};z.onclick=()=>checkWhite(battle.selected||$('#answerInput').value,correct)}
function checkWhite(a,correct){if(norm(a)===norm(correct)){toast('碎片净化成功');const item=q();if(++battle.subIndex>=item.subs.length){battle.subIndex=0;nextQuestion()}else renderBattle()}else attack()}
function norm(s){return (s||'').replace(/[，。、“”‘’；：,.!！?？\s]/g,'')}
function checkFull(correct){if(norm($('#fullInput').value)===norm(correct)){toast('知识重构完成');nextQuestion()}else attack()}
function nextQuestion(){battle.qIndex++;if(battle.qIndex>=3){if(battle.round===3){settleVictory();setMusic('calm');return}battle.round++;battle.qIndex=0;battle.subIndex=0;battle.order=shuffle([0,1,2])}setTimeout(renderBattle,300)}
$('#leaveBattle').onclick=()=>{show('#homeView');setMusic('calm')};$('#returnHome').onclick=()=>{$('#victoryModal').classList.remove('open');show('#homeView');setActiveTab('dungeon')};$('#closePrep').onclick=()=>$('#prepModal').classList.remove('open');$('#confirmBattle').onclick=beginBattle;
function settleVictory(){const key=`${nav.book}-${nav.unit}-${nav.lesson}`,now=Date.now(),recent=now-(state.lastClears[key]||0)<3*24*60*60*1000,reward=recent?3:5,oldLevel=state.level;state.coins+=reward;state.lastClears[key]=now;state.energy++;state.levelCharge++;let leveled=false;while(state.levelCharge>=levelNeed(state.level)){state.levelCharge-=levelNeed(state.level);state.level++;leveled=true}grantSpellFromCharge();save();const lensUnlocked=oldLevel<4&&state.level>=4;$('#victoryReward').innerHTML=`魔法石充能 +1<br>金币 +${reward}${recent?'（三天内重复通关）':''}${leveled?`<br>等级提升至 ${state.level} 级`:''}${lensUnlocked?'<br>获得新道具：透镜':''}`;$('#victoryModal').classList.add('open')}
function talentStats(){return{crit:(state.talents.includes('crit')?5:0)+(state.talents.includes('nature')?5:0),bonus:(state.talents.includes('growth')?2:0)+(state.talents.includes('nature')?3:0),lucky:(state.talents.includes('lucky')?5:0)+(state.talents.includes('nature')?3:0)}}
function grantSpellFromCharge(){if(state.weapon==='starter'){state.spellCharges++;if(state.spellCharges<2)return;state.spellCharges-=2}state.spells++;const chance=talentStats().lucky;if(chance&&Math.random()*100<chance){state.spells++;setTimeout(()=>toast('幸运触发：额外获得 1 次施法'),500)}}
function setActiveTab(tab){$('#dungeonTab').classList.toggle('on',tab==='dungeon');$('#homesteadTab').classList.toggle('on',tab==='home')}

$('#dungeonTab').onclick=()=>{show('#homeView');setActiveTab('dungeon')};$('#homesteadTab').onclick=openHomestead;
const weaponNames={starter:'初级法杖',medium:'中级魔杖',advanced:'高级法杖'};
function renderHomestead(){const clean=state.pollution<=0,stats=talentStats();$('#treeScene').classList.toggle('clean',clean);$('#treeTitle').textContent=clean?'新生树苗':'混沌古树';$('#treeSub').textContent=clean?'施放生长魔法，让树苗向天空生长':'每次净化减少 3% 污染，每净化 1% 获得 10 金币';$('#treeMetricLabel').textContent=clean?'树木高度':'污染值';$('#treeMetric').textContent=clean?formatHeight(state.treeHeight):state.pollution+'%';$('#pollutionBar').style.width=(clean?Math.min(100,state.treeHeight/1000*100):state.pollution)+'%';$('#spellText').textContent=state.spells;$('#castBtn').textContent=clean?'施放生长魔法':'施放净化魔法';$('#castBtn').disabled=state.spells<1;$('#attributeGrid').innerHTML=`<div class="attribute">当前武器<b>${weaponNames[state.weapon]}</b></div><div class="attribute">可施法次数<b>${state.spells}</b></div><div class="attribute">暴击概率<b>${stats.crit}%</b></div><div class="attribute">固定生长加成<b>+${stats.bonus} cm</b></div><div class="attribute">额外次数概率<b>${stats.lucky}%</b></div><div class="attribute">已获天赋<b>${state.talents.length}/4</b></div>`;document.querySelectorAll('[data-buy]').forEach(btn=>{const type=btn.dataset.buy,owned=state.weapon===type||(state.weapon==='advanced'&&type==='medium'),price=type==='medium'?100:300;btn.disabled=owned||state.coins<price;btn.textContent=owned?'已拥有':price+' 金币'})}
function formatHeight(cm){return cm<100?cm+' cm':(cm/100).toFixed(2).replace(/\.00$/,'')+' m'}
document.querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>{const type=btn.dataset.buy,price=type==='medium'?100:300;if(state.coins<price)return toast('金币不足');if(state.weapon===type||(state.weapon==='advanced'&&type==='medium'))return;state.coins-=price;state.weapon=type;state.spellCharges=0;save();renderHomestead();toast('已装备'+weaponNames[type])});
$('#castBtn').onclick=()=>{if(state.spells<1)return toast('魔法石充能后才能施法');state.spells--;if(state.pollution>0){const purified=Math.min(3,state.pollution);state.pollution=Math.max(0,state.pollution-purified);const reward=purified*10;state.coins+=reward;save();renderHomestead();toast(`污染值 -${purified}%，金币 +${reward}`);return}const stats=talentStats(),base=6+Math.floor(Math.random()*7)+stats.bonus,critical=stats.crit&&Math.random()*100<stats.crit,gain=critical?base*2:base,old=state.treeHeight;state.treeHeight+=gain;save();renderHomestead();toast(critical?`暴击！树木生长 ${gain} cm`:`树木生长 ${gain} cm`);checkTalentMilestone(old,state.treeHeight)};
function checkTalentMilestone(oldHeight,newHeight){const milestones=[100,300,500,1000];const next=milestones.find((m,i)=>oldHeight<m&&newHeight>=m&&!state.talentMilestones.includes(i));if(next){const i=milestones.indexOf(next);state.talentMilestones.push(i);save();setTimeout(()=>openTalent(i),500)}}
function openTalent(index){const choices=index<3?[['crit','暴击','每次生长魔法有 5% 概率高度翻倍'],['growth','疯长','每次施法生长高度 +2 cm'],['lucky','幸运','每次充能有 5% 概率额外获得 1 次施法']].filter(x=>!state.talents.includes(x[0])):[['nature','自然之友','暴击 +5%，生长 +3 cm，额外施法概率 +3%']];$('#talentChoices').innerHTML=choices.map(x=>`<button class="talent ${x[0]==='nature'?'gold':''}" data-talent="${x[0]}"><h3>${x[1]}</h3><span>${x[2]}</span></button>`).join('');document.querySelectorAll('[data-talent]').forEach(btn=>btn.onclick=()=>{state.talents.push(btn.dataset.talent);save();$('#talentModal').classList.remove('open');renderHomestead();toast('永久天赋已生效')});$('#talentModal').classList.add('open')}
function allReviewItems(){return lessons.flatMap((l,li)=>l.questions.flatMap((x,qi)=>x.subs.map((s,si)=>({id:`${li}-${qi}-${si}`,q:s.q,a:s.a}))))}
function openReview(){const items=allReviewItems().sort((a,b)=>(state.reviews[a.id]||0)-(state.reviews[b.id]||0)),r=items[0];$('#reviewBody').innerHTML=`<div class="review-q">${r.q}<br><span class="blank">填写黄框内容</span></div><textarea class="answer-input" id="reviewInput" placeholder="写下答案"></textarea><div class="action-row"><span class="hint">答对恢复 30 生命</span><button class="primary" id="submitReview">确认</button></div>`;$('#submitReview').onclick=()=>{if(norm($('#reviewInput').value)===norm(r.a)){state.hp=Math.min(100,state.hp+30);state.reviews[r.id]=Date.now();save();toast('记忆恢复，生命 +30');$('#reviewModal').classList.remove('open')}else attack()};$('#reviewModal').classList.add('open')}
$('#crystalBtn').onclick=openReview;$('#closeReview').onclick=()=>$('#reviewModal').classList.remove('open');
let audioCtx=null,musicMode='off',timer=null;function setMusic(mode){musicMode=mode;if(!audioCtx)return;clearInterval(timer);const play=()=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=mode==='battle'?'sawtooth':'sine';o.frequency.value=mode==='battle'?[110,147,165,196][Math.floor(Math.random()*4)]:[196,220,247][Math.floor(Math.random()*3)];g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+(mode==='battle'?.18:.8));o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(mode==='battle'?.2:.85))};timer=setInterval(play,mode==='battle'?230:900);play()}
